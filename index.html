<style>
:root{--g:#0E5A47;--y:#FFC83D;--c:#FF6A3D;--bg:#F3F8F4;--ink:#10241C;--mut:#5F7268;--ln:#DCE8E0}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 ui-rounded,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--g);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
.lg{font-size:20px}.bar div{display:flex;gap:6px}
button,input,select{font:inherit}input,select{width:100%;padding:11px 12px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;margin:5px 0}
.bt{border:0;border-radius:12px;padding:9px 14px;background:#fff;color:var(--g);font-weight:700;cursor:pointer;border:1.5px solid var(--ln)}
.bt.y{background:var(--y);color:var(--ink);border-color:var(--y)}.bt.w{width:100%;margin-top:8px;padding:12px}.bt:disabled{opacity:.45}
.bn{background:linear-gradient(120deg,var(--g),var(--g2,#1B8A6B));background-size:cover;background-position:center;color:#fff;padding:34px 18px 30px;border-radius:0 0 28px 28px}
.bn h1{margin:0 0 6px;font-size:30px;line-height:1.1;max-width:15ch}.bn p{margin:0;opacity:.9}
.sr{padding:14px 14px 0}.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px}.chip{border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:7px 14px;white-space:nowrap}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:6px 14px}@media(min-width:700px){.gr{grid-template-columns:repeat(4,1fr)}}
.cd{background:#fff;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 10px #0e5a4714}
.im{aspect-ratio:1;border-radius:12px;background:#E6F1EA;display:grid;place-items:center;font-size:40px;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.pr{color:var(--c);font-weight:800;font-size:18px}.em{padding:20px;color:var(--mut);text-align:center}
.md{position:fixed;inset:0;background:#10241c99;display:none;align-items:flex-end;justify-content:center;z-index:9}.md.on{display:flex}
.mb{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.mb h2{margin:0 0 8px}

.tb{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}.tb button{border:0;background:#fff;border-radius:99px;padding:8px 14px;white-space:nowrap;font-weight:700;color:var(--mut)}.tb .on{background:var(--y);color:var(--ink)}
.pv{padding:0 14px}.bx{background:#fff;border-radius:16px;padding:12px;margin:10px 0}.rw{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px}
.cp{width:90px;border-radius:10px;margin-top:6px}.ok{color:var(--g);font-weight:700}.ng,.Rechazado{color:#C62828;font-weight:700}.Pendiente{color:var(--c)}.Pagado{color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}.kp div{background:#fff;border-radius:16px;padding:12px}.kp b{display:block;font-size:20px}
.ch{display:flex;align-items:center;gap:2px;height:120px;background:#fff;border-radius:16px;padding:10px}.ch i{flex:1;background:var(--g);border-radius:3px 3px 0 0;min-height:2px}.ch i.n{background:#C62828}
.th{width:40px;height:40px;border-radius:10px;overflow:hidden;background:#E6F1EA;display:grid;place-items:center;flex:none}.th img{width:100%;height:100%;object-fit:cover}.Confirmado{color:#6B2C91}.Entregado{color:var(--g)}.bn{cursor:pointer}textarea{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:10px;margin:6px 0}
#app{max-width:1200px;margin:0 auto}
.hero{position:relative;overflow:hidden;border-radius:0 0 24px 24px;background:var(--g)}
.hs{display:flex;transition:transform .55s ease}
.sl{position:relative;flex:0 0 100%;aspect-ratio:5/4;overflow:hidden;color:#fff;background:linear-gradient(120deg,var(--g),var(--g2,#1B8A6B))}
@media(min-width:700px){.sl{aspect-ratio:16/6.5}.hero{border-radius:24px;margin:12px 14px 0}}
.bgb{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(22px) brightness(.65)}
.sl img{position:relative;display:block;width:100%;height:100%;object-fit:contain}
.cap{position:absolute;left:0;right:0;bottom:0;padding:56px 18px 38px;background:linear-gradient(0deg,#000000b8,transparent);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.cap h1{margin:0;font-size:clamp(24px,5vw,42px);line-height:1.1;max-width:20ch}

.sg{padding:12px 16px 0;color:var(--mut);font-size:14px}.ft{padding:30px 14px 10px;text-align:center}.ft a{color:#9AAAA1;font-size:12px;cursor:pointer;text-decoration:underline}

:root{--lime:#DDF26B}
body{background:#F4F6F2}

.rbs{display:flex;gap:8px;align-items:center}

.hero{margin:12px 14px 0;border-radius:30px;box-shadow:0 6px 24px #10241c22}
.sl{aspect-ratio:16/11}@media(min-width:700px){.sl{aspect-ratio:16/6.5}}
.dt i.on{background:var(--lime)}

.mn{display:inline-block;background:var(--lime);color:var(--ink);font-weight:700;font-size:15px;padding:10px 16px;border-radius:99px}
.sr{display:none;padding:10px 14px 0}.sr.on{display:block}
.gr{gap:14px;padding:12px 14px}

.lt{font-size:92px;font-weight:800;color:#6AAE8A;line-height:1}

const L=['CIERRE DE CAJA - '+S.cfg.name,'Periodo: '+(fd||fm),'Vendedor: '+(A_()?'todos':me.u),'Cerrado: '+new Date().toLocaleString(),'','Ventas: '+l.length,'Efectivo: '+M(sm('Efectivo')),'Yape: '+M(sm('Yape')),'TOTAL VENDIDO: '+M(sm()),'','Productos vendidos:',...Object.entries(pp).map(([n,q])=>'  '+q+' x '+n),'','Stock al cierre:',...S.prods.map(p=>'  '+p.n+': '+p.st)];
S.closes.unshift({id:uid(),f:new Date().toISOString(),vd:me.u,per:fd||fm,tot:sm(),pdf:mkpdf(L)});save();toast('Caja cerrada y guardada como PDF')}
function pdfGo(id,d){const c=S.closes.find(x=>x.id==id),b=atob(c.pdf),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const url=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));if(d){const a=document.createElement('a');a.href=url;a.download='cierre-'+c.per+'-'+c.vd+'.pdf';a.click()}else window.open(url)}
V.cr=()=>{$('#pv').innerHTML=S.closes.filter(c=>A_()||c.vd==me.u).map(c=>`<div class="bx"><div class="rw"><b>${c.per} · ${esc(c.vd)}</b><b>${M(c.tot)}</b></div><small>${new Date(c.f).toLocaleString()}</small><div class="rw"><button class="bt y" onclick="pdfGo('${c.id}')">Ver PDF</button><button class="bt" onclick="pdfGo('${c.id}',1)">Descargar</button></div></div>`).join('')||'<p class="em">Aún no hay cierres de caja.</p>'}
V.gs=()=>{$('#pv').innerHTML=`<div class="bx"><h3>Gasto externo (bolsas, vasos...)</h3><input id="g1" placeholder="Concepto"><input id="g2" type="number" step="0.01" placeholder="Monto"><select id="g3"><option value="tienda">Dinero de la tienda (caja)</option><option value="inv">Inversión (otro dinero)</option></select><button class="bt y w" onclick="gad()">Registrar gasto</button></div>`+[...S.exp.map(e=>({id:e.id,l:'exp',f:e.f,c:e.c,m:e.m,src:e.src,k:'Gasto'})),...S.buys.map(b=>({id:b.id,l:'buys',f:b.f,c:b.q+' × '+b.n,m:b.tot,src:b.src,k:'Compra'}))].sort((a,b)=>b.f.localeCompare(a.f)).map(e=>`<div class="ln" onclick="ged('${e.l}','${e.id}')"><span>${esc(e.c)}<small>${e.k} · ${e.f.slice(0,10)} · ${e.src=='inv'?'Inversión':'Caja'} · toca para editar</small></span><b>${M(e.m)}</b><button class="bt" style="padding:7px 10px" onclick="event.stopPropagation();gdl('${e.l}','${e.id}')">Eliminar</button></div>`).join('')}
function ged(l,id){const e=S[l].find(x=>x.id==id);if(!e)return;const g=l=='exp';
modal(`<h2>Editar ${g?'gasto':'compra'}</h2>${g?`<input id="e1" placeholder="Concepto" value="${esc(e.c)}">`:`<p>${e.q} × ${esc(e.n)}</p>`}<input id="e2" type="number" step="0.01" placeholder="Monto total" value="${g?e.m:e.tot}"><select id="e3"><option value="tienda" ${e.src!='inv'?'selected':''}>Dinero de la tienda (caja)</option><option value="inv" ${e.src=='inv'?'selected':''}>Inversión (otro dinero)</option></select><button class="bt y w" onclick="gsv('${l}','${id}')">Guardar cambios</button><button class="bt w" onclick="gdl('${l}','${id}')">Eliminar</button><button class="bt w" onclick="close_()">Cerrar</button>`)}
function gsv(l,id){const e=S[l].find(x=>x.id==id),m=+$('#e2').value;if(!(m>0))return toast('Escribe un monto válido');if(l=='exp'){e.c=$('#e1').value.trim()||e.c;e.m=m}else{e.tot=m;e.pc=e.q?m/e.q:e.pc}e.src=$('#e3').value;save();close_();V.gs();toast('Cambios guardados')}
function gdl(l,id){if(!confirm(l=='exp'?'¿Eliminar este gasto?':'¿Eliminar esta compra? El stock no cambia: corrígelo en Productos.'))return;S[l]=S[l].filter(x=>x.id!=id);save();close_();V.gs();toast('Eliminado')}
function reset0(){if(!confirm('Se guardará el historial y luego las ventas, los gastos, las compras y la caja chica volverán a 0. Tus productos y el stock NO cambian. ¿Continuar?'))return;
const sm=(a,f)=>a.reduce((x,y)=>x+f(y),0),t=sm(S.sales,s=>s.tot),c=sm(S.sales,s=>s.cs),ex=sm(S.exp,e=>e.m),cb=sm(S.buys.filter(b=>b.src!='inv'),b=>b.tot),cg=sm(S.exp.filter(e=>e.src!='inv'),e=>e.m),fs=S.sales.map(s=>s.f).sort();
S.hist.unshift({id:uid(),f:new Date().toISOString(),d:fs[0]||'',h:fs[fs.length-1]||'',n:S.sales.length,ing:t,cs:c,ex,cap:S.cfg.cap||0,caja:(S.cfg.cap||0)+t-cb-cg,sales:S.sales,buys:S.buys,exp:S.exp});
S.sales.forEach(s=>S.del.push(s.id));S.sales=[];S.buys=[];S.exp=[];S.cfg.cap=0;save();V.db();toast('Listo: ventas y caja en 0. El historial quedó guardado')}
function sdel(id){const s=S.sales.find(x=>x.id==id);if(!s||!confirm('¿Eliminar esta venta del historial?'))return;
if(confirm('¿Devolver el stock de esta venta a la tienda?\nAceptar = sí, devolver. Cancelar = no tocar el stock.'))s.it.forEach(unsell);
S.sales=S.sales.filter(x=>x!==s);S.del.push(id);save();V.vt();toast('Venta eliminada')}
V.hs=()=>{$('#pv').innerHTML=S.hist.length?S.hist.map(h=>`<div class="bx"><div class="rw"><b>${h.d?h.d.slice(0,10):'—'} → ${h.h?h.h.slice(0,10):'—'}</b><small>reiniciado ${h.f.slice(0,10)}</small></div><div class="kp"><div>Ventas<b>${h.n}</b></div><div>Ingresos<b>${M(h.ing)}</b></div><div>${h.ing-h.cs-h.ex>=0?'Ganancia':'Pérdida'}<b class="${h.ing-h.cs-h.ex>=0?'ok':'ng'}">${M(h.ing-h.cs-h.ex)}</b></div><div>Caja al cerrar<b>${M(h.caja)}</b></div></div><div class="rw"><button class="bt y" onclick="hcsv('${h.id}')">Descargar Excel (CSV)</button><button class="bt" onclick="hdl('${h.id}')">Eliminar</button></div></div>`).join(''):'<p class="em">Aún no hay historial. Aparece aquí cuando reinicias las ventas.</p>'}
function hcsv(id){const h=S.hist.find(x=>x.id==id),r=[['Fecha','Vendedor','Cliente','Pago','Detalle','Total','Costo','Ganancia']].concat(h.sales.map(s=>[s.f.slice(0,16).replace('T',' '),s.vd,s.cl||'',s.py,s.it.map(i=>i.q+'x '+i.n).join('; '),s.tot,s.cs,s.tot-s.cs]));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='historial-ventas-'+h.f.slice(0,10)+'.csv';a.click()}
function hdl(id){if(confirm('¿Eliminar este historial para siempre? No se puede recuperar.')){S.hist=S.hist.filter(x=>x.id!=id);save();V.hs()}}
function gad(){const c=$('#g1').value.trim(),m=+$('#g2').value;if(!c||!m)return toast('Escribe concepto y monto');S.exp.unshift({id:uid(),f:new Date().toISOString(),c,m,src:$('#g3').value});save();V.gs()}
function csv(){const r=[['Fecha','Vendedor','Cliente','Pago','Detalle','Total'].concat(A_()?['Costo','Ganancia']:[])].concat(sl().map(s=>[s.f.slice(0,16).replace('T',' '),s.vd,s.cl||'',s.py,s.it.map(i=>i.q+'x '+i.n).join('; '),s.tot].concat(A_()?[s.cs,s.tot-s.cs]:[])));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='ventas.csv';a.click()}
V.db=()=>{const mo=x=>x.f.slice(0,7)==dm,sm=(a,f)=>a.reduce((s,x)=>s+f(x),0),l=S.sales.filter(mo),t=sm(l,s=>s.tot),c=sm(l,s=>s.cs),ex=sm(S.exp.filter(mo),e=>e.m),g=t-c-ex,
cj=S.cfg.cap+sm(S.sales,s=>s.tot)-sm(S.buys.filter(b=>b.src=='tienda'),b=>b.tot)-sm(S.exp.filter(e=>e.src=='tienda'),e=>e.m),
inv=sm(S.prods,p=>p.pc*p.st),val=sm(S.prods,p=>p.pv*p.st),iv=sm(S.buys.filter(b=>b.src=='inv'),b=>b.tot)+sm(S.exp.filter(e=>e.src=='inv'),e=>e.m),
nd=new Date(dm.slice(0,4),dm.slice(5),0).getDate(),dy=Array.from({length:nd},(_,i)=>l.filter(s=>+s.f.slice(8,10)==i+1).reduce((a,s)=>a+s.tot-s.cs,0)),mx=Math.max(1,...dy.map(Math.abs)),pp={};
l.forEach(s=>s.it.forEach(i=>pp[i.n]=(pp[i.n]||0)+(i.pv-i.pc)*i.q));const K=(n,v,c)=>`<div>${n}<b class="${c||''}">${v}</b></div>`;
$('#pv').innerHTML=`<input type="month" value="${dm}" onchange="dm=this.value;V.db()"><div class="kp">${K('Ingresos',M(t))}${K('Costo de lo vendido',M(c))}${K('Gastos externos',M(ex))}${K(g>=0?'Ganas':'Pierdes',M(g),g>=0?'ok':'ng')}${K('Caja chica (efectivo + Yape)',M(cj),cj>=0?'ok':'ng')}${K('Capital inicial',M(S.cfg.cap))}${K('Inversión aportada',M(iv))}${K('Mercadería a precio de compra',M(inv))}${K('Mercadería a precio de venta',M(val))}${K('Ganancia si vendes todo',M(val-inv),'ok')}${K('Productos con poco stock',S.prods.filter(p=>p.st<=3).length)}</div><div class="ch">${dy.map(v=>`<i class="${v<0?'n':''}" style="height:${Math.abs(v)/mx*100}%"></i>`).join('')}</div><small>Ganancia por día del mes</small><div class="bx"><h3>Ganancia por producto</h3>${Object.entries(pp).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="ln"><span>${esc(n)}</span><b class="${v>=0?'ok':'ng'}">${M(v)}</b></div>`).join('')||'<p class="em">Sin ventas este mes.</p>'}</div><button class="bt w" style="color:#C62828" onclick="reset0()">Reiniciar ventas y caja a 0</button><small>Guarda el historial. No cambia productos ni stock.</small>`}
V.cf=()=>{const c=S.cfg;$('#pv').innerHTML=`<div class="bx"><h3>Tienda</h3><input id="a1" placeholder="Nombre de la tienda" value="${esc(c.name)}"><input id="a2" placeholder="Frase" value="${esc(c.slogan)}"><input id="a3" placeholder="Texto del banner de promoción" value="${esc(c.bannerTxt)}"><input id="a4" type="tel" placeholder="WhatsApp con código (51999999999)" value="${esc(c.wa)}"><input id="a5" type="number" placeholder="Capital inicial" value="${c.cap}"><label>Color de la app</label><input id="a6" type="color" value="${c.color||'#0E5A47'}" style="height:46px;padding:4px"><label>Ícono junto al nombre de la tienda</label><input type="file" accept="image/*" onchange="img(this.files[0],160,d=>{S.cfg.logo=d;toast('Ícono cargado: toca Guardar ajustes')})"><label>Foto del banner</label><input type="file" accept="image/*" onchange="img(this.files[0],900,d=>{S.cfg.banner=d;toast('Banner cargado')})"><label>QR de Yape</label><input type="file" accept="image/*" onchange="img(this.files[0],500,d=>{S.cfg.qr=d;toast('QR cargado')})"><button class="bt y w" onclick="csv2()">Guardar ajustes</button>${/[?&]conectar\b/.test(location.search)?`<p class="em" style="padding:8px">${URL_SHEETS?'✅ Conectado a Google Sheets':'⚠️ Sin conexión a Google Sheets: tus usuarios y productos solo existen en este celular'}</p><input id="a7" placeholder="URL de Apps Script (termina en /exec)" value="${esc(URL_SHEETS)}"><button class="bt w" onclick="conectar()">Conectar y guardar en Sheets</button><button class="bt w" onclick="sync0()">Sincronizar con Google Sheets ahora</button>`:''}<button class="bt w" onclick="bkp()">Descargar respaldo (archivo)</button><label>Restaurar respaldo</label><input type="file" accept=".json,application/json" onchange="rest(this.files[0])">${URL_SHEETS?`<small style="word-break:break-all;display:block;margin-top:8px">Enlace para tus clientes y vendedores (ya conectado): ${esc(location.href.split('?')[0]+'?u='+encodeURIComponent(URL_SHEETS))}</small>`:''}</div><div class="bx"><h3>Banners de promoción</h3>${S.banners.map((b,i)=>`<div class="ln"><span>${esc(b.t)}<small>${b.promo&&PR(b.promo)?'Enlaza: '+esc(PR(b.promo).n):'Sin promoción'}</small></span><button class="bt" onclick="S.banners.splice(${i},1);save();V.cf()">Quitar</button></div>`).join('')}<input id="b1" placeholder="Frase del banner"><input type="file" accept="image/*" onchange="img(this.files[0],900,d=>bImg=d)"><select id="b2"><option value="">Sin promoción enlazada</option>${S.promos.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select><button class="bt w" onclick="S.banners.push({t:$('#b1').value||'Promoción',img:bImg,promo:$('#b2').value});bImg='';save();V.cf()">Agregar banner</button></div><div class="bx"><h3>Promociones (combos)</h3>${S.promos.map((p,i)=>{const f=pinfo(p.items,p.pr),r=preal(p);return `<div class="bx" style="margin:8px 0;background:#F4F6F2"><div class="rw"><b>${esc(p.n)}</b><b>${M(p.pr)}</b></div><small>${p.items.map(x=>x.q+' × '+esc(PP(x.id).n||'?')).join(' + ')}</small><div>Costo ${M(f.c)} · Precio normal ${M(f.r)} · El cliente ahorra ${M(f.ah)}</div><div>Stock de la promo: <b>${pst(p)}</b> combos${p.lim!=null?' (límite '+p.lim+')':''}</div><div class="${f.g>0?'ok':f.g<0?'ng':''}">${pver(f)}</div><small>Vendidas: ${r.n} · Ganancia real: ${M(r.g)}</small><div class="rw"><button class="bt" onclick="plim(${i})">Cambiar cantidad</button><button class="bt" onclick="S.promos.splice(${i},1);save();V.cf()">Quitar</button></div></div>`}).join('')}<input id="m1" placeholder="Nombre (ej. Galleta + gaseosa)"><input id="m2" type="number" step="0.01" placeholder="Precio del combo" oninput="pvw()"><p class="em" style="padding:4px">Elige cuántas unidades de cada producto lleva el combo:</p><div style="max-height:200px;overflow:auto">${S.prods.map(p=>`<div class="ln"><span>${esc(p.n)}<small>stock ${p.st} · compra ${M(p.pc)} · venta ${M(p.pv)}</small></span><input type="number" min="0" class="mq" data-id="${p.id}" value="0" style="width:72px" oninput="pvw()"></div>`).join('')}</div><input id="m3" type="number" min="1" placeholder="Cantidad de promociones a ofrecer (opcional)"><div id="mp"></div><button class="bt w" onclick="mad()">Crear promoción</button></div><div class="bx"><h3>Usuarios</h3>${S.users.map((u,i)=>`<div class="ln"><span>${esc(u.u)}<small>${u.r}</small></span>${i?`<button class="bt" onclick="udl(${i})">Quitar</button>`:''}</div>`).join('')}<input id="u1" placeholder="Usuario nuevo" autocapitalize="none"><input id="u2" placeholder="Clave"><button class="bt w" onclick="uad()">Crear vendedor</button><input id="u3" placeholder="Nueva clave del administrador"><button class="bt w" onclick="S.users[0].p=$('#u3').value||S.users[0].p;save();toast('Clave actualizada')">Cambiar mi clave</button></div>`}
function pinfo(it,pr){const c=it.reduce((a,i)=>a+PP(i.id).pc*i.q,0),r=it.reduce((a,i)=>a+PP(i.id).pv*i.q,0),g=pr-c;return{c,r,g,m:pr?g/pr*100:0,ah:r-pr,st:it.length?Math.min(...it.map(i=>Math.floor(PP(i.id).st/i.q))):0}}
const pver=f=>f.g>0?`✅ Sí resulta: ganas ${M(f.g)} por combo (${f.m.toFixed(0)}%)`:f.g==0?'⚠️ No ganas ni pierdes':`❌ No resulta: pierdes ${M(-f.g)} por combo`;
function preal(pm){let n=0,g=0;S.sales.forEach(s=>s.it.forEach(i=>{if(i.id=='promo:'+pm.id){n+=i.q;g+=(i.pv-i.pc)*i.q}}));return{n,g}}
function unsell(i){(i.combo||[{id:i.id,q:1}]).forEach(c=>{const p=S.prods.find(x=>x.id==c.id);if(p)p.st+=c.q*i.q});const pm=String(i.id).startsWith('promo:')&&PR(i.id.slice(6));if(pm&&pm.lim!=null)pm.lim+=i.q}
const mits=()=>[...document.querySelectorAll('.mq')].map(e=>({id:e.dataset.id,q:Math.floor(+e.value)||0})).filter(i=>i.q>0);
function pvw(){const it=mits(),pr=+$('#m2').value||0;$('#mp').innerHTML=it.length&&pr?(f=>`<div class="bx" style="background:#F4F6F2"><div>Costo ${M(f.c)} · Precio normal ${M(f.r)} · El cliente ahorra ${M(f.ah)}</div><div>Con tu stock puedes armar <b>${f.st}</b> combos</div><div class="${f.g>0?'ok':f.g<0?'ng':''}">${pver(f)}</div></div>`)(pinfo(it,pr)):''}
function plim(i){const v=prompt('Cantidad de promociones a ofrecer (vacío = según tu stock)',S.promos[i].lim==null?'':S.promos[i].lim);if(v===null)return;S.promos[i].lim=v===''?null:Math.max(0,Math.floor(+v)||0);save();V.cf()}
function mad(){const it=mits(),n=$('#m1').value.trim(),pr=+$('#m2').value,l=$('#m3').value;if(!it.length||!n||!pr)return toast('Falta nombre, precio o productos');S.promos.push({id:uid(),n,pr,items:it,on:true,lim:l?Math.max(1,Math.floor(+l)):null});save();V.cf();toast('Promoción creada')}
function csv2(){Object.assign(S.cfg,{name:$('#a1').value,slogan:$('#a2').value,bannerTxt:$('#a3').value,wa:$('#a4').value.replace(/\D/g,''),cap:+$('#a5').value||0,color:$('#a6').value});save();theme();hd();toast('Ajustes guardados')}
function uad(){const u=$('#u1').value.trim(),p=$('#u2').value;if(!u||!p||S.users.some(x=>x.u==u))return toast('Usuario vacío o repetido');S.users.push({u,p,r:'vendedor'});save();V.cf()}
function udl(i){S.users.splice(i,1);save();V.cf()}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{render();if(/[?&]admin\b/.test(location.search))setTimeout(login,300);if(URL_SHEETS)try{const r=await fetch(URL_SHEETS).then(r=>r.json());if(r.cfg){S.cfg={...S.cfg,...r.cfg};S.prods=r.prods;S.banners=r.banners||[];S.promos=r.promos||[];render()}}catch(e){}})();
</script></body></html>
