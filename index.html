<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Bodega</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0E5A47"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--g:#0E5A47;--y:#FFC83D;--c:#FF6A3D;--bg:#F3F8F4;--ink:#10241C;--mut:#5F7268;--ln:#DCE8E0}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 ui-rounded,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--g);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
.lg{font-size:20px}.bar div{display:flex;gap:6px}
button,input,select{font:inherit}input,select{width:100%;padding:11px 12px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;margin:5px 0}
.bt{border:0;border-radius:12px;padding:9px 14px;background:#fff;color:var(--g);font-weight:700;cursor:pointer;border:1.5px solid var(--ln)}
.bt.y{background:var(--y);color:var(--ink);border-color:var(--y)}.bt.w{width:100%;margin-top:8px;padding:12px}.bt:disabled{opacity:.45}
.bn{background:linear-gradient(120deg,var(--g),var(--g2,#1B8A6B));background-size:cover;background-position:center;color:#fff;padding:34px 18px 30px;border-radius:0 0 28px 28px}
.bn h1{margin:0 0 6px;font-size:30px;line-height:1.1;max-width:15ch}.bn p{margin:0;opacity:.9}
.sr{padding:14px 14px 0}.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px}.chip{border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:7px 14px;white-space:nowrap}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:6px 14px}@media(min-width:700px){.gr{grid-template-columns:repeat(4,1fr)}}
.cd{background:#fff;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 10px #0e5a4714}
.im{aspect-ratio:1;border-radius:12px;background:#E6F1EA;display:grid;place-items:center;font-size:40px;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.pr{color:var(--c);font-weight:800;font-size:18px}.em{padding:20px;color:var(--mut);text-align:center}
.md{position:fixed;inset:0;background:#10241c99;display:none;align-items:flex-end;justify-content:center;z-index:9}.md.on{display:flex}
.mb{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.mb h2{margin:0 0 8px}
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}.ln small{display:block;color:var(--mut)}
.tt{font-size:20px;font-weight:800;text-align:right;padding:10px 0}.qr{width:200px;display:block;margin:8px auto;border-radius:12px}
.tb{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}.tb button{border:0;background:#fff;border-radius:99px;padding:8px 14px;white-space:nowrap;font-weight:700;color:var(--mut)}.tb .on{background:var(--y);color:var(--ink)}
.pv{padding:0 14px}.bx{background:#fff;border-radius:16px;padding:12px;margin:10px 0}.rw{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px}
.cp{width:90px;border-radius:10px;margin-top:6px}.ok{color:var(--g);font-weight:700}.ng,.Rechazado{color:#C62828;font-weight:700}.Pendiente{color:var(--c)}.Pagado{color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}.kp div{background:#fff;border-radius:16px;padding:12px}.kp b{display:block;font-size:20px}
.ch{display:flex;align-items:center;gap:2px;height:120px;background:#fff;border-radius:16px;padding:10px}.ch i{flex:1;background:var(--g);border-radius:3px 3px 0 0;min-height:2px}.ch i.n{background:#C62828}
.th{width:40px;height:40px;border-radius:10px;overflow:hidden;background:#E6F1EA;display:grid;place-items:center;flex:none}.th img{width:100%;height:100%;object-fit:cover}.Confirmado{color:#6B2C91}.Entregado{color:var(--g)}.bn{cursor:pointer}textarea{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:10px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:99}
</style></head><body>

const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),M=n=>'S/ '+(+n||0).toFixed(2),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const K='bodega_v1';
let S=JSON.parse(localStorage.getItem(K)||'null')||{cfg:{name:'Mi Bodega',slogan:'Todo para tu hogar, a un paso de ti',bannerTxt:'Ofertas de la semana',banner:'',qr:'',wa:'',cap:0},users:[{u:'admin',p:'admin123',r:'admin'}],prods:[],sales:[],orders:[]};
const PR=id=>S.promos.find(x=>x.id==id),PP=id=>S.prods.find(x=>x.id==id)||{st:0,pc:0};
const pst=pm=>Math.min(...pm.items.map(i=>Math.floor(PP(i.id).st/i.q)));
function look(id){if(String(id).startsWith('promo:')){const pm=PR(id.slice(6));return pm&&{id,n:pm.n,pv:pm.pr,st:pst(pm),img:'',combo:pm.items,pc:pm.items.reduce((a,i)=>a+PP(i.id).pc*i.q,0)}}return S.prods.find(x=>x.id==id)}
let bImg='',tkOrder='',fp='',bi=0,bt,strm;
['buys','exp','banners','promos','closes'].forEach(k=>S[k]=S[k]||[]);
let me=null,view='store',tab='ped',q='',cat='',CT=[],cart={},capImg='',tk={},pq='',tImg='',dm=new Date().toISOString().slice(0,7),fd='',fm=dm,V={},st;
const post=b=>fetch(URL_SHEETS,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)}).then(r=>r.json());
function save(){localStorage.setItem(K,JSON.stringify(S));if(me&&URL_SHEETS){clearTimeout(st);st=setTimeout(()=>post({a:'estado',u:me.u,p:me.p,state:S}).then(r=>{if(r.orders)S.orders=r.orders}).catch(()=>toast('Sin conexión: se guardó solo en este celular')),1200)}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',3200)}
function modal(h){$('#md').innerHTML='<div class="mb">'+h+'</div>';$('#md').classList.add('on')}function close_(){$('#md').classList.remove('on')}
function img(f,mx,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};i.src=r.result};r.readAsDataURL(f)}
function hd(){$('#hd').innerHTML=`<div class="bar"><span style="display:flex;align-items:center;gap:8px"><img src="${S.cfg.logo||LOGO}" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover"><b class="lg">${esc(S.cfg.name)}</b></span><div>${me?`<button class="bt" onclick="go()">${view=='store'?'Panel':'Tienda'}</button><button class="bt" onclick="out()">Salir</button>`:`<button class="bt" onclick="login()">Ingresar</button>`}${view=='store'?`<button class="bt y" onclick="cartM()">🛒 ${Object.values(cart).reduce((a,b)=>a+b,0)}</button>`:''}</div></div>`}
function theme(){const c=S.cfg.color||'#0E5A47',r=document.documentElement.style;r.setProperty('--g',c);r.setProperty('--g2',c=='#0E5A47'?'#1B8A6B':`color-mix(in srgb,${c} 70%,#fff)`);const m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute('content',c)}
function render(){theme();hd();view=='panel'&&me?panel():store()}
function go(){view=view=='store'?'panel':'store';render()}
function out(){me=null;view='store';render()}
function ban(){const e=$('#bn');if(!e)return;const b=S.banners,x=b.length?b[bi%b.length]:{t:S.cfg.bannerTxt,img:S.cfg.banner};e.style.backgroundImage=x.img?`linear-gradient(90deg,${S.cfg.color||'#0E5A47'}ee,${S.cfg.color||'#0E5A47'}55),url(${x.img})`:'';$('#bh').textContent=x.t;e.onclick=x.promo&&PR(x.promo)?()=>add('promo:'+x.promo):null}
function store(){CT=[...new Set(S.prods.map(p=>p.cat).filter(Boolean))];
$('#app').innerHTML=`<section class="bn" id="bn"><h1 id="bh"></h1><p>${esc(S.cfg.slogan)}</p></section><div class="sr"><input placeholder="Buscar producto" value="${esc(q)}" oninput="q=this.value;grid()"></div><div class="chips">${['',...CT].map((c,i)=>`<button class="chip ${c==cat?'on':''}" onclick="cat=CT[${i-1}]||'';store()">${esc(c)||'Todo'}</button>`).join('')}</div><div id="gr" class="gr"></div>`;grid();clearInterval(bt);ban();if(S.banners.length>1)bt=setInterval(()=>{bi++;ban()},4000)}
function grid(){const pr=(q||cat)?[]:S.promos.filter(pm=>pst(pm)>0),l=S.prods.filter(p=>(!cat||p.cat==cat)&&p.n.toLowerCase().includes(q.toLowerCase()));
$('#gr').innerHTML=pr.map(pm=>`<div class="cd" style="background:#FFF4D6"><div class="im">🎁</div><b>${esc(pm.n)}</b><small>${pm.items.map(i=>i.q+' '+esc(PP(i.id).n||'?')).join(' + ')}</small><span class="pr">${M(pm.pr)}</span><button class="bt y" onclick="add('promo:${pm.id}')">Agregar promo</button></div>`).join('')+(l.length?l.map(p=>`<div class="cd"><div class="im">${p.img?`<img src="${p.img}">`:'🛒'}</div><b>${esc(p.n)}</b><span class="pr">${M(p.pv)}</span><button class="bt y" ${p.st>0?'':'disabled'} onclick="add('${p.id}')">${p.st>0?'Agregar':'Agotado'}</button></div>`).join(''):pr.length?'':'<p class="em">Aún no hay productos. El administrador puede agregarlos desde el panel.</p>')}
function add(id){const p=look(id);if(!p||(cart[id]||0)>=p.st)return toast('No hay más stock');cart[id]=(cart[id]||0)+1;hd();toast(p.n+' agregado')}
function chg(id,d){const p=look(id);cart[id]=Math.min(p.st,(cart[id]||0)+d);if(cart[id]<=0)delete cart[id];hd();cartM()}
const items=()=>Object.entries(cart).map(([id,n])=>({p:look(id),n})).filter(x=>x.p);

V.pd=()=>{$('#pv').innerHTML=`<button class="bt y w" onclick="pf()">+ Nuevo producto</button>`+S.prods.map(p=>`<div class="ln" onclick="pf('${p.id}')"><span>${esc(p.n)}<small>${esc(p.cat)} · compra ${M(p.pc)} · stock ${p.st}${p.st<=3?' · poco stock':''}</small></span><b>${M(p.pv)}</b><small class="${p.pv>=p.pc?'ok':'ng'}">${M(p.pv-p.pc)}</small></div>`).join('')}

function gad(){const c=$('#g1').value.trim(),m=+$('#g2').value;if(!c||!m)return toast('Escribe concepto y monto');if(!$('#g3').value)return toast('Elige si el dinero es de la tienda o de inversión');S.exp.unshift({id:uid(),f:new Date().toISOString(),c,m,src:$('#g3').value});save();V.gs()}
function csv(){const r=[['Fecha','Vendedor','Cliente','Pago','Detalle','Total'].concat(A_()?['Costo','Ganancia']:[])].concat(sl().map(s=>[s.f.slice(0,16).replace('T',' '),s.vd,s.cl||'',s.py,s.it.map(i=>i.q+'x '+i.n).join('; '),s.tot].concat(A_()?[s.cs,s.tot-s.cs]:[])));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='ventas.csv';a.click()}
V.db=()=>{const mo=x=>x.f.slice(0,7)==dm,sm=(a,f)=>a.reduce((s,x)=>s+f(x),0),l=S.sales.filter(mo),t=sm(l,s=>s.tot),c=sm(l,s=>s.cs),ex=sm(S.exp.filter(mo),e=>e.m),g=t-c-ex,
cj=S.cfg.cap+sm(S.sales,s=>s.tot)-sm(S.buys.filter(b=>b.src=='tienda'),b=>b.tot)-sm(S.exp.filter(e=>e.src=='tienda'),e=>e.m),
inv=sm(S.prods,p=>p.pc*p.st),val=sm(S.prods,p=>p.pv*p.st),iv=sm(S.buys.filter(b=>b.src=='inv'),b=>b.tot)+sm(S.exp.filter(e=>e.src=='inv'),e=>e.m),
nd=new Date(dm.slice(0,4),dm.slice(5),0).getDate(),dy=Array.from({length:nd},(_,i)=>l.filter(s=>+s.f.slice(8,10)==i+1).reduce((a,s)=>a+s.tot-s.cs,0)),mx=Math.max(1,...dy.map(Math.abs)),pp={};
l.forEach(s=>s.it.forEach(i=>pp[i.n]=(pp[i.n]||0)+(i.pv-i.pc)*i.q));const K=(n,v,c)=>`<div>${n}<b class="${c||''}">${v}</b></div>`;
$('#pv').innerHTML=`<input type="month" value="${dm}" onchange="dm=this.value;V.db()"><div class="kp">${K('Ingresos',M(t))}${K('Costo de lo vendido',M(c))}${K('Gastos externos',M(ex))}${K(g>=0?'Ganas':'Pierdes',M(g),g>=0?'ok':'ng')}${K('Caja chica (efectivo + Yape)',M(cj),cj>=0?'ok':'ng')}${K('Capital inicial',M(S.cfg.cap))}${K('Inversión aportada',M(iv))}${K('Mercadería a precio de compra',M(inv))}${K('Mercadería a precio de venta',M(val))}${K('Ganancia si vendes todo',M(val-inv),'ok')}${K('Productos con poco stock',S.prods.filter(p=>p.st<=3).length)}</div><div class="ch">${dy.map(v=>`<i class="${v<0?'n':''}" style="height:${Math.abs(v)/mx*100}%"></i>`).join('')}</div><small>Ganancia por día del mes</small><div class="bx"><h3>Ganancia por producto</h3>${Object.entries(pp).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="ln"><span>${esc(n)}</span><b class="${v>=0?'ok':'ng'}">${M(v)}</b></div>`).join('')||'<p class="em">Sin ventas este mes.</p>'}</div>`}
V.cf=()=>{const c=S.cfg;$('#pv').innerHTML=`<div class="bx"><h3>Tienda</h3><input id="a1" placeholder="Nombre de la tienda" value="${esc(c.name)}"><input id="a2" placeholder="Frase" value="${esc(c.slogan)}"><input id="a3" placeholder="Texto del banner de promoción" value="${esc(c.bannerTxt)}"><input id="a4" type="tel" placeholder="WhatsApp con código (51999999999)" value="${esc(c.wa)}"><input id="a5" type="number" placeholder="Capital inicial" value="${c.cap}"><label>Color de la app</label><input id="a6" type="color" value="${c.color||'#0E5A47'}" style="height:46px;padding:4px"><label>Ícono junto al nombre de la tienda</label><input type="file" accept="image/*" onchange="img(this.files[0],160,d=>{S.cfg.logo=d;toast('Ícono cargado: toca Guardar ajustes')})"><label>Foto del banner</label><input type="file" accept="image/*" onchange="img(this.files[0],900,d=>{S.cfg.banner=d;toast('Banner cargado')})"><label>QR de Yape</label><input type="file" accept="image/*" onchange="img(this.files[0],500,d=>{S.cfg.qr=d;toast('QR cargado')})"><button class="bt y w" onclick="csv2()">Guardar ajustes</button><button class="bt w" onclick="sync0()">Sincronizar con Google Sheets ahora</button></div><div class="bx"><h3>Banners de promoción</h3>${S.banners.map((b,i)=>`<div class="ln"><span>${esc(b.t)}<small>${b.promo&&PR(b.promo)?'Enlaza: '+esc(PR(b.promo).n):'Sin promoción'}</small></span><button class="bt" onclick="S.banners.splice(${i},1);save();V.cf()">Quitar</button></div>`).join('')}<input id="b1" placeholder="Frase del banner"><input type="file" accept="image/*" onchange="img(this.files[0],900,d=>bImg=d)"><select id="b2"><option value="">Sin promoción enlazada</option>${S.promos.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select><button class="bt w" onclick="S.banners.push({t:$('#b1').value||'Promoción',img:bImg,promo:$('#b2').value});bImg='';save();V.cf()">Agregar banner</button></div><div class="bx"><h3>Promociones (combos)</h3>${S.promos.map((p,i)=>`<div class="ln"><span>${esc(p.n)}<small>${p.items.map(x=>esc(PP(x.id).n||'?')).join(' + ')}</small></span><b>${M(p.pr)}</b><button class="bt" onclick="S.promos.splice(${i},1);save();V.cf()">Quitar</button></div>`).join('')}<input id="m1" placeholder="Nombre (ej. Galleta + gaseosa)"><input id="m2" type="number" step="0.01" placeholder="Precio del combo"><div style="max-height:160px;overflow:auto">${S.prods.map(p=>`<label class="ln"><span>${esc(p.n)}</span><input type="checkbox" class="mk" value="${p.id}" style="width:auto"></label>`).join('')}</div><button class="bt w" onclick="mad()">Crear promoción</button></div><div class="bx"><h3>Usuarios</h3>${S.users.map((u,i)=>`<div class="ln"><span>${esc(u.u)}<small>${u.r}</small></span>${i?`<button class="bt" onclick="udl(${i})">Quitar</button>`:''}</div>`).join('')}<input id="u1" placeholder="Usuario nuevo" autocapitalize="none"><input id="u2" placeholder="Clave"><button class="bt w" onclick="uad()">Crear vendedor</button><input id="u3" placeholder="Nueva clave del administrador"><button class="bt w" onclick="S.users[0].p=$('#u3').value||S.users[0].p;save();toast('Clave actualizada')">Cambiar mi clave</button></div><div class="bx"><h3>Respaldo y migración</h3><p class="em" style="padding:4px;text-align:left">Descarga toda la información (productos, ventas, pedidos, compras, gastos, promociones, usuarios y ajustes). Si más adelante cambias la app, importas este archivo y todo vuelve a subirse.</p><button class="bt y w" onclick="bkExp()">Descargar respaldo completo (.json)</button><button class="bt w" onclick="impM()">Importar respaldo desde archivo</button><button class="bt w" onclick="impSh()">Restaurar desde Google Sheets</button></div><div class="bx"><h3>Restaurar modo fábrica</h3><p class="em" style="padding:4px;text-align:left">Borra productos, ventas, pedidos, compras, gastos, promociones, banners y ajustes, y deja la app como nueva (usuario admin, clave admin123). Pide tu clave de administrador.</p><button class="bt w" style="color:#C62828;border-color:#C62828" onclick="fabM()">Restaurar modo fábrica</button></div>`}
function fmod(){const set=$('#fm2').value=='set',p=S.prods.find(x=>x.n.toLowerCase()==$('#fn').value.trim().toLowerCase());$('#fs').placeholder=set?'Stock correcto (cantidad exacta)':'Cantidad que ingresa (se suma al stock)';$('#fs').value=set&&p?p.st:'';$('#ff').style.display=set?'none':''}
function gdel(k,id){if(!confirm(k=='Gasto'?'¿Eliminar este gasto?':'¿Eliminar este registro de compra? El stock del producto no cambia (corrígelo en Productos si hace falta).'))return;if(k=='Gasto')S.exp=S.exp.filter(x=>x.id!=id);else S.buys=S.buys.filter(x=>x.id!=id);save();V.gs();toast('Eliminado')}
function fabM(){modal(`<h2>Restaurar modo fábrica</h2><p>Se borrará <b>todo</b>: productos, ventas, pedidos, compras, gastos, promociones, banners, usuarios y ajustes${URL_SHEETS?', también en Google Sheets':''}. No se puede deshacer. Al terminar, ingresas con <b>admin / admin123</b>.</p><button class="bt w" onclick="bkExp()">Descargar respaldo antes (recomendado)</button><input id="fpw" type="password" placeholder="Clave de administrador"><button class="bt w" style="background:#C62828;color:#fff;border-color:#C62828" onclick="fabGo()">Borrar todo y restaurar</button><button class="bt w" onclick="close_()">Cancelar</button>`)}
async function fabGo(){const pw=$('#fpw').value;if(!A_()||pw!==me.p)return toast('Clave de administrador incorrecta');clearTimeout(st);
if(URL_SHEETS){try{const r=await post({a:'reset',u:me.u,p:pw});if(!r.ok)return toast('Google Sheets no aceptó la clave. No se borró nada')}catch(e){return toast('Sin conexión con Google Sheets. No se borró nada')}}
S={cfg:{name:'Mi Bodega',slogan:'Todo para tu hogar, a un paso de ti',bannerTxt:'Ofertas de la semana',banner:'',qr:'',wa:'',cap:0},users:[{u:'admin',p:'admin123',r:'admin'}],prods:[],sales:[],orders:[],buys:[],exp:[],banners:[],promos:[],closes:[]};
localStorage.setItem(K,JSON.stringify(S));me=null;view='store';cart={};tk={};tkOrder='';q='';cat='';close_();render();toast('App restaurada de fábrica. Ingresa con admin / admin123')}
function bkExp(){const d={app:'bodega',version:1,fecha:new Date().toISOString(),state:S},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='respaldo-bodega-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Respaldo descargado')}
function impM(){modal(`<h2>Importar respaldo</h2><p>Elige el archivo .json que descargaste.</p><input type="file" id="if" accept=".json,application/json"><select id="im"><option value="merge">Sumar a lo que ya tengo (no borra nada)</option><option value="all">Reemplazar todo con el respaldo</option></select><button class="bt y w" onclick="impFile()">Importar</button><button class="bt w" onclick="close_()">Cerrar</button>`)}
function impFile(){const f=$('#if').files[0];if(!f)return toast('Elige el archivo de respaldo');const m=$('#im').value,r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return toast('El archivo no es un respaldo válido')}impApply(d,m)};r.readAsText(f)}
async function impSh(){if(!URL_SHEETS)return toast('Falta pegar la URL de Apps Script en index.html');toast('Descargando desde Google Sheets...');try{const r=await post({a:'respaldo',u:me.u,p:me.p});if(!r.ok)return toast('No se pudo: solo el administrador puede restaurar');impApply(r.state,'merge')}catch(e){toast('Sin conexión con Google Sheets')}}
function impApply(d,m){const b=d&&d.state?d.state:d;if(!b||!Array.isArray(b.prods))return toast('El archivo no es un respaldo válido');
['prods','sales','orders','buys','exp','banners','promos','closes','users'].forEach(k=>b[k]=Array.isArray(b[k])?b[k]:[]);b.cfg=b.cfg||{};let n=0;
if(m=='all'){if(!confirm('Esto reemplaza todo lo que hay ahora. ¿Continuar?'))return;const c=S.cfg;S=b;S.cfg={...c,...b.cfg};if(!S.users.length)S.users=[{u:'admin',p:'admin123',r:'admin'}];n=b.prods.length;if(!S.users.some(x=>x.u==me.u&&x.p==me.p))me=S.users[0]}
else{const mp={};b.prods.forEach(p=>{const x=S.prods.find(y=>y.id==p.id)||S.prods.find(y=>y.n.toLowerCase()==String(p.n).toLowerCase());if(x){mp[p.id]=x.id;Object.assign(x,{n:p.n,cat:p.cat,pc:p.pc,pv:p.pv,img:p.img||x.img})}else{S.prods.push(p);mp[p.id]=p.id;n++}});
b.promos.forEach(pm=>pm.items=(pm.items||[]).map(i=>({...i,id:mp[i.id]||i.id})));
['sales','orders','buys','exp','banners','promos','closes'].forEach(k=>{const ids=new Set(S[k].map(x=>x.id));b[k].forEach(x=>{if(!ids.has(x.id))S[k].push(x)});if(S[k].some(x=>x.f))S[k].sort((p,q)=>String(q.f||'').localeCompare(String(p.f||'')))});
b.users.forEach(u=>{if(!S.users.some(x=>x.u==u.u))S.users.push(u)});Object.keys(b.cfg).forEach(k=>{if(!S.cfg[k])S.cfg[k]=b.cfg[k]})}
tab='pd';save();close_();render();toast('Respaldo importado · productos nuevos: '+n)}
function mad(){const it=[...document.querySelectorAll('.mk:checked')].map(e=>({id:e.value,q:1})),n=$('#m1').value.trim(),pr=+$('#m2').value;if(!it.length||!n||!pr)return toast('Falta nombre, precio o productos');S.promos.push({id:uid(),n,pr,items:it,on:true});save();V.cf()}
function sync0(){if(!URL_SHEETS)return toast('Falta pegar la URL de Apps Script en index.html');post({a:'estado',u:me.u,p:me.p,state:S}).then(r=>{if(r.ok){if(r.orders)S.orders=r.orders;toast('Datos guardados en Google Sheets')}else toast('No se pudo guardar: revisa tu usuario')}).catch(()=>toast('Sin conexión con Google Sheets'))}
function csv2(){Object.assign(S.cfg,{name:$('#a1').value,slogan:$('#a2').value,bannerTxt:$('#a3').value,wa:$('#a4').value.replace(/\D/g,''),cap:+$('#a5').value||0,color:$('#a6').value});save();theme();hd();toast('Ajustes guardados')}
function uad(){const u=$('#u1').value.trim(),p=$('#u2').value;if(!u||!p||S.users.some(x=>x.u==u))return toast('Usuario vacío o repetido');S.users.push({u,p,r:'vendedor'});save();V.cf()}
function udl(i){S.users.splice(i,1);save();V.cf()}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{render();if(URL_SHEETS)try{const r=await fetch(URL_SHEETS).then(r=>r.json());if(r.cfg){S.cfg={...S.cfg,...r.cfg};S.prods=r.prods;S.banners=r.banners||[];S.promos=r.promos||[];render()}}catch(e){}})();
</script></body></html>
